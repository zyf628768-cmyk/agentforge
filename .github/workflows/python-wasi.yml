name: python-wasi-runtime
on:
  push:
    paths:
      - '.github/workflows/python-wasi.yml'
      - 'tools/ci/build_python_wasi.py'
      - 'src/agentforge/**'
      - 'tools/qualify_wasi.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      manifest: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build pinned official CPython for WASI
        run: python tools/ci/build_python_wasi.py --output python-wasi-runtime
      - id: manifest
        name: Record built runtime identity
        shell: bash
        run: echo "sha256=$(sha256sum python-wasi-runtime/runtime-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpython-wasi-runtime
          path: |
            python-wasi-runtime
            wasi-build.log
  qualify-runtime:
    needs: build-runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: cpython-wasi-runtime
          path: runtime-bundle
      - run: python -m pip install .
      - name: Real Python execution, repair, regression and capability probes
        run: python tools/qualify_wasi.py --runtime-dir runtime-bundle/python-wasi-runtime --manifest-sha256 ${{ needs.build-runtime.outputs.manifest }} --output qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasi-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: qualification
