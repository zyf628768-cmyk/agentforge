name: real-rootless-gvisor
on:
  push:
    paths:
      - 'src/agentforge/**'
      - 'tools/qualify_container.py'
      - 'tools/ci/rootless-gvisor.sh'
      - '.github/workflows/sandbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containment:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Provision an isolated disposable test runner
        run: bash tools/ci/rootless-gvisor.sh
      - name: Exercise actual Python containment and crash recovery
        run: python tools/qualify_container.py --container-config sandbox-policy.json --output sandbox-evidence --restart-disposable-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-gvisor-evidence
          path: |
            sandbox-evidence
            sandbox-provision.log
            sandbox-policy.json
