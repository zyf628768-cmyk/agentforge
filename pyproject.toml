[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.2.0a4"
description = "Offline Skill engineering with capability-free WebAssembly execution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "AgentForge contributors"}]
dependencies = ["wasmtime>=49,<50", "jsonschema>=4.23,<5", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.11,<1"]

[project.scripts]
agentforge = "agentforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentforge = ["data/*.json", "data/*.wat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
